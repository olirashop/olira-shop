<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0a08"/>
<meta name="description" id="meta-desc" content="موضة نسائية — اطلبي عبر واتساب والدفع عند الاستلام"/>
<title>OliraShop — موضة نسائية</title>
<link rel="icon" href="logo.png"/>
<meta property="og:type" content="website"/>
<meta property="og:locale" content="ar_MA"/>
<meta property="og:site_name" content="OliraShop"/>
<meta property="og:title" id="og-title" content="OliraShop — موضة نسائية"/>
<meta property="og:description" id="og-desc" content="موضة نسائية — اطلبي عبر واتساب والدفع عند الاستلام"/>
<meta property="og:image" id="og-img" content="logo.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══ TOKENS ═══ */
:root{
  --ink:#0b0a08;--ink2:#141210;--ink3:#1e1c19;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5e0a0;
  --rose:#d4a0b0;--rose2:#e8b8c8;
  --gold-rgb:201,168,76;--rose-rgb:212,160,176;
  --on-gold:#0b0a08;--on-rose:#0b0a08;
  --ink-rgb:11,10,8;--text-rgb:247,243,236;--r:0px;
  --cream:#f7f3ec;--cream2:#ede6d8;--smoke:#9b958a;
  --border:rgba(var(--gold-rgb),.18);--border2:rgba(var(--gold-rgb),.35);
  --danger:#e06a6a;--success:#4a9e6f;
  --fast:150ms;--normal:250ms;--slow:400ms;
  --ease:cubic-bezier(.4,0,.2,1);
  --hh:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-t:var(--font);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--ink);color:var(--cream);min-height:100vh;overflow-x:hidden;direction:rtl;line-height:1.6}
button,input,select,textarea{font-family:var(--font)}
img{max-width:100%}
::selection{background:var(--gold);color:var(--on-gold)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--ink2)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold),var(--rose))}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ═══ LOADER ═══ */
#loader{position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;transition:opacity .5s,visibility .5s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{height:110px;width:auto;max-width:70vw;object-fit:contain;animation:ldPulse 1.4s ease-in-out infinite}
.ld-bar{width:120px;height:1px;background:var(--border);position:relative;overflow:hidden}
.ld-bar::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:ldSlide 1.4s ease-in-out infinite}
@keyframes ldPulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes ldSlide{to{left:200%}}
.logo-txt{font-family:'Bebas Neue','Cairo',sans-serif;font-size:1.6rem;color:var(--gold);letter-spacing:.12em;line-height:1}

/* ═══ ANNOUNCE ═══ */
.announce{background:var(--gold);color:var(--on-gold);text-align:center;padding:.5rem 1rem;font-size:.85rem;font-weight:600;line-height:1.5}
.announce a{color:inherit;text-decoration:underline}

/* ═══ HEADER ═══ */
header{position:sticky;top:0;z-index:200;height:var(--hh);background:rgba(var(--ink-rgb),.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(.5rem,3vw,2rem);gap:.5rem}
.h-start{display:flex;align-items:center;gap:.15rem;justify-content:flex-start}
.h-end{display:flex;align-items:center;justify-content:flex-end}
.logo-link{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.logo-img{height:46px;width:auto;max-width:48vw;object-fit:contain;transition:opacity var(--normal)}
.logo-img:hover{opacity:.85}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--cream2);transition:color var(--fast)}
.icon-btn:hover{color:var(--gold)}
.menu-btn{display:none}
.cart-btn{display:flex;align-items:center;gap:.5rem;height:42px;padding:0 1rem;border:1px solid var(--border2);background:transparent;color:var(--cream);cursor:pointer;font-size:.85rem;font-weight:600;transition:all var(--normal);white-space:nowrap}
.cart-btn:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.cart-badge{background:var(--gold);color:var(--on-gold);border-radius:99px;min-width:20px;height:20px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;transition:background var(--normal)}
.cart-btn:hover .cart-badge{background:var(--ink);color:var(--gold)}

/* ═══ SEARCH OVERLAY ═══ */
.search-ov{position:fixed;inset:0;background:rgba(var(--ink-rgb),.97);z-index:700;display:flex;align-items:flex-start;justify-content:center;padding:6rem 1rem 0;opacity:0;pointer-events:none;transition:opacity var(--normal)}
.search-ov.open{opacity:1;pointer-events:all}
.search-box{width:min(600px,100%);position:relative}
.search-box input{width:100%;background:none;border:none;border-bottom:2px solid var(--gold);color:var(--cream);font-size:1.6rem;font-weight:400;padding:.5rem 0 .5rem 3rem;outline:none;text-align:right;direction:rtl}
.search-box input::placeholder{color:var(--smoke)}
.search-x{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.8rem;width:44px;height:44px;transition:color var(--fast)}
.search-x:hover{color:var(--cream)}

/* ═══ MOBILE DRAWER ═══ */
.mob-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;opacity:0;pointer-events:none;transition:opacity var(--normal)}
.mob-ov.open{opacity:1;pointer-events:all}
.mob-drawer{position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--ink2);border-left:1px solid var(--border);z-index:501;transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.mob-drawer.open{transform:translateX(0);visibility:visible}
.mob-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.mob-logo{height:44px;width:auto;max-width:60%;object-fit:contain}
.mob-x{background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.6rem;line-height:1;width:44px;height:44px;transition:color var(--fast)}
.mob-x:hover{color:var(--cream)}
.mob-search{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.mob-search input{width:100%;background:none;border:none;border-bottom:1px solid var(--border2);color:var(--cream);font-size:16px;padding:.5rem 0;outline:none;text-align:right;direction:rtl}
.mob-search input::placeholder{color:var(--smoke)}
.mob-section{padding:1.1rem 1.25rem;flex:1;overflow-y:auto}
.mob-title{font-size:.78rem;color:var(--gold);margin-bottom:.6rem;font-weight:600}
.mob-chip{display:block;width:100%;text-align:right;padding:.7rem .75rem;background:none;border:none;color:var(--cream2);font-size:.95rem;cursor:pointer;transition:all var(--fast);border-right:2px solid transparent}
.mob-chip:hover,.mob-chip.on{color:var(--gold);border-right-color:var(--gold);background:rgba(var(--gold-rgb),.06)}
.mob-footer{padding:1.25rem;padding-bottom:calc(1.25rem + var(--safe-b));border-top:1px solid var(--border);font-size:.85rem;color:var(--smoke);line-height:1.9;text-align:right}
.mob-footer strong{display:block;font-size:1.05rem;color:var(--gold);margin-bottom:.3rem}
.mob-footer a{color:var(--gold2);text-decoration:none}

/* ═══ HERO ═══ */
.hero{min-height:min(88svh,780px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem 3.5rem;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 70% 80%,rgba(var(--rose-rgb),.08) 0%,transparent 55%),radial-gradient(ellipse 60% 70% at 20% 20%,rgba(var(--gold-rgb),.07) 0%,transparent 50%)}
.hero>*{position:relative;z-index:1}
.hero>.hero-bg,.hero>.hero-img,.hero>.hero-ov{position:absolute;inset:0;z-index:0}
.hero-logo{height:210px;width:auto;max-width:80vw;object-fit:contain;margin-bottom:1.25rem;filter:drop-shadow(0 0 40px rgba(var(--gold-rgb),.18))}
.hero-sub{font-size:1.05rem;color:var(--cream2);max-width:420px;line-height:1.9;margin-bottom:2rem;opacity:.85}
.hero-btns{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
.btn-gold{padding:.85rem 2.3rem;background:var(--gold);color:var(--on-gold);border:none;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:all var(--normal);min-height:46px}
.btn-gold:hover{background:var(--gold3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(var(--gold-rgb),.28)}
.btn-ghost{padding:.85rem 2rem;background:transparent;color:var(--cream2);border:1px solid var(--border2);cursor:pointer;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:all var(--normal);min-height:46px}
.btn-ghost:hover{border-color:var(--rose);color:var(--rose)}

/* ═══ FILTERS ═══ */
.filters{display:flex;align-items:center;gap:.4rem;padding:.7rem clamp(.75rem,3vw,2rem);border-bottom:1px solid var(--border);background:var(--ink2);overflow-x:auto;position:sticky;top:var(--hh);z-index:100;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{height:0}
.chip{padding:.4rem 1.05rem;border:1px solid transparent;background:none;font-size:.88rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all var(--fast);color:var(--smoke);min-height:38px}
.chip:hover{color:var(--cream);border-color:var(--border2)}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}

/* ═══ SECTION ═══ */
.section{padding:3.5rem clamp(.75rem,3vw,2rem)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;gap:1rem}
.sec-title{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:var(--cream);line-height:1.2}
.sec-title span{color:var(--gold)}
.sec-sub{font-size:.9rem;color:var(--smoke);line-height:1.7;text-align:left;max-width:280px}

/* ═══ PRODUCT GRID ═══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.empty{grid-column:1/-1;text-align:center;color:var(--smoke);padding:4rem 1rem;background:var(--ink)}

/* ═══ PRODUCT CARD ═══ */
.card{background:var(--ink2);overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}
.card-imgs{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--ink3);cursor:pointer;touch-action:pan-y}
.card-imgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--slow),transform .7s var(--ease)}
.card-imgs img:not(.on){opacity:0}
.card-imgs img.on{opacity:1}
@media(hover:hover){.card:hover .card-imgs img.on{transform:scale(1.04)}}
.card-arrows{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 .4rem;opacity:0;transition:opacity var(--fast);pointer-events:none}
.card:hover .card-arrows{opacity:1}
.card:hover .card-arrows .arrow{pointer-events:all}
@media(hover:none){.card-arrows{display:none}}
.arrow{width:34px;height:34px;background:rgba(var(--ink-rgb),.8);border:none;color:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all var(--fast)}
.arrow:hover{background:var(--gold);color:var(--on-gold)}
.dots{position:absolute;bottom:.55rem;left:0;right:0;display:flex;gap:.3rem;justify-content:center;pointer-events:none}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(var(--text-rgb),.4);transition:all var(--fast)}
.dot.on{background:var(--gold);width:14px;border-radius:3px}
.tags{position:absolute;top:.6rem;right:.6rem;z-index:2;display:flex;flex-direction:column;gap:.3rem;align-items:flex-start;pointer-events:none}
.tag-sale{background:var(--gold);color:var(--on-gold);font-size:.75rem;font-weight:700;padding:.15rem .55rem}
.tag-badge{background:var(--rose);color:var(--on-rose);font-size:.72rem;font-weight:600;padding:.15rem .55rem}
.tag-out{position:absolute;top:.6rem;left:.6rem;z-index:2;background:rgba(var(--ink-rgb),.88);color:var(--cream2);font-size:.72rem;padding:.15rem .55rem;border:1px solid var(--border2)}
.card.out .card-imgs img{filter:grayscale(.6) brightness(.7)}
.card-body{padding:1rem 1rem 1.1rem;text-align:right;display:flex;flex-direction:column;flex:1;min-width:0}
.card-cat{font-size:.72rem;color:var(--gold);margin-bottom:.2rem;font-weight:600}
.card-name{font-size:1rem;font-weight:600;color:var(--cream);margin-bottom:.5rem;line-height:1.55;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;min-height:3.1em}
.card-name:hover{color:var(--rose2)}
.card-prices{display:flex;align-items:baseline;justify-content:flex-start;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
.p-was{font-size:.82rem;color:var(--smoke);text-decoration:line-through}
.p-now{font-size:1.1rem;font-weight:700;color:var(--gold)}
.p-reg{font-size:1.1rem;font-weight:700;color:var(--cream2)}
.sizes{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem;justify-content:flex-start}
.sz{min-width:38px;height:34px;padding:0 .6rem;border:1px solid var(--border2);background:transparent;font-size:.8rem;color:var(--cream2);cursor:pointer;transition:all var(--fast);user-select:none}
.sz:hover{border-color:var(--rose);color:var(--rose)}
.sz.on{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.sz.sold,.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed;border-style:dashed}
.sz-err{font-size:.78rem;color:var(--danger);margin-bottom:.5rem;display:none;text-align:right}
.sz-err.show{display:block}
.sz-guide{align-self:flex-start;font-size:.78rem;color:var(--smoke);cursor:pointer;background:none;border:none;text-decoration:underline;margin-bottom:.6rem;padding:.2rem 0;transition:color var(--fast)}
.sz-guide:hover{color:var(--gold)}
.no-size-badge{display:inline-flex;align-self:flex-start;align-items:center;gap:.3rem;font-size:.78rem;color:var(--rose);background:rgba(var(--rose-rgb),.1);border:1px solid rgba(var(--rose-rgb),.3);padding:.2rem .65rem;margin-bottom:.7rem}
.cd-line{display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:rgba(var(--rose-rgb),.08);border:1px dashed rgba(var(--rose-rgb),.35);padding:.35rem .6rem;margin-bottom:.7rem;font-size:.78rem;color:var(--cream2)}
.cd-t{font-weight:700;color:var(--rose);font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.04em}
.card-foot{display:flex;gap:.4rem;margin-top:auto;align-items:stretch}
.btn-add{flex:1;min-height:44px;padding:.5rem .6rem;background:transparent;border:1px solid var(--border2);color:var(--cream);cursor:pointer;font-size:.9rem;font-weight:600;transition:all var(--normal)}
.btn-add:hover:not(:disabled){background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.btn-add:disabled{opacity:.4;cursor:not-allowed}
.ic-btn{width:44px;min-height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);background:transparent;color:var(--smoke);cursor:pointer;font-size:1.05rem;transition:all var(--fast)}
.ic-btn.wish:hover,.ic-btn.wish.on{border-color:var(--rose);color:var(--rose)}
.ic-btn.wish.on{background:rgba(var(--rose-rgb),.1)}
.ic-btn.share:hover{border-color:var(--gold);color:var(--gold)}

/* ═══ FLY DOT ═══ */
.fly{position:fixed;width:12px;height:12px;border-radius:50%;background:var(--rose);pointer-events:none;z-index:9000;transition:left .65s var(--ease),top .65s var(--ease),opacity .65s,transform .65s;box-shadow:0 0 12px var(--rose)}

/* ═══ DETAIL MODAL ═══ */
.det-ov{position:fixed;inset:0;background:rgba(var(--ink-rgb),.93);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem}
.det-ov.open{display:flex}
.det-modal{background:var(--ink2);border:1px solid var(--border);width:920px;max-width:100%;max-height:92vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative}
.det-imgs{background:var(--ink3);position:relative;overflow-y:auto}
.det-main{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;cursor:zoom-in;touch-action:pan-y}
.det-thumbs{display:flex;gap:.4rem;padding:.65rem;overflow-x:auto;background:var(--ink2)}
.det-thumb{width:54px;height:68px;object-fit:cover;cursor:pointer;flex-shrink:0;border:2px solid transparent;opacity:.55;transition:all var(--normal)}
.det-thumb.on{border-color:var(--gold);opacity:1}
.det-x{position:absolute;top:.65rem;left:.65rem;width:40px;height:40px;background:rgba(var(--ink-rgb),.88);border:1px solid var(--border);color:var(--cream);cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;z-index:5;transition:all var(--fast)}
.det-x:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.det-info{display:flex;flex-direction:column;overflow-y:auto;text-align:right}
.det-body{padding:1.75rem 1.75rem 1rem;display:flex;flex-direction:column;gap:.9rem;flex:1}
.det-cat{font-size:.78rem;color:var(--gold);font-weight:600}
.det-name{font-size:1.5rem;font-weight:700;color:var(--cream);line-height:1.5;word-break:break-word}
.det-prices{display:flex;align-items:baseline;justify-content:flex-start;gap:.75rem;flex-wrap:wrap}
.det-desc{font-size:.92rem;color:var(--cream2);opacity:.8;line-height:1.95;border-top:1px solid var(--border);padding-top:.9rem;white-space:pre-line}
.det-sz-lbl{font-size:.82rem;color:var(--gold);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.det-sz-lbl button{background:none;border:none;color:var(--smoke);font-size:.78rem;text-decoration:underline;cursor:pointer}
.det-sizes{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:flex-start}
.det-hint{font-size:.8rem;color:var(--danger);display:none;text-align:right}
.det-foot{position:sticky;bottom:0;background:var(--ink2);padding:.9rem 1.75rem;padding-bottom:calc(.9rem + var(--safe-b));border-top:1px solid var(--border)}
.det-foot .btn-add{width:100%;background:var(--rose);color:var(--on-rose);border-color:var(--rose);min-height:50px;font-size:1rem}
.det-foot .btn-add:hover:not(:disabled){background:var(--rose2)}

/* ═══ ZOOM ═══ */
.zoom-ov{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:800;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.zoom-ov.open{display:flex}
.zoom-ov img{max-width:96vw;max-height:92vh;object-fit:contain}

/* ═══ SIZE GUIDE ═══ */
.tailles-ov{position:fixed;inset:0;background:rgba(var(--ink-rgb),.93);z-index:800;display:none;align-items:center;justify-content:center;padding:1rem}
.tailles-ov.open{display:flex}
.tailles-box{background:var(--ink2);border:1px solid var(--border);width:520px;max-width:100%;max-height:88vh;overflow:auto;padding:1.75rem;position:relative}
.tailles-x{position:absolute;top:.6rem;left:.6rem;background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.6rem;width:44px;height:44px;transition:color var(--fast)}
.tailles-x:hover{color:var(--cream)}
.tailles-box h3{font-size:1.25rem;font-weight:700;color:var(--cream);margin-bottom:1.1rem;text-align:right}
.tailles-tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tailles-tbl th{padding:.6rem .5rem;text-align:center;font-size:.78rem;color:var(--gold);border-bottom:1px solid var(--border);font-weight:600}
.tailles-tbl td{padding:.6rem .5rem;text-align:center;color:var(--cream2);border-bottom:1px solid rgba(var(--gold-rgb),.08);direction:ltr}
.tailles-tbl tr:last-child td{border:none}
.tailles-note{font-size:.82rem;color:var(--smoke);margin-top:1rem;line-height:1.8;text-align:right}

/* ═══ CART ═══ */
.cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;opacity:0;pointer-events:none;transition:opacity var(--normal)}
.cart-ov.open{opacity:1;pointer-events:all}
.cart-drw{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;background:var(--ink2);border-left:1px solid var(--border);z-index:401;transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.cart-drw.open{transform:translateX(0);visibility:visible}
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;border-bottom:1px solid var(--border)}
.cart-hd h3{font-size:1.25rem;font-weight:700;color:var(--cream)}
.cart-hd-r{display:flex;align-items:center;gap:.4rem}
.cart-clear{font-size:.8rem;color:var(--smoke);background:none;border:none;cursor:pointer;padding:.6rem;transition:color var(--fast)}
.cart-clear:hover{color:var(--danger)}
.cart-x{background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.6rem;line-height:1;width:44px;height:44px;transition:color var(--fast)}
.cart-x:hover{color:var(--cream)}
.cart-items{flex:1;overflow-y:auto;padding:.5rem 1.25rem}
.cart-empty{text-align:center;color:var(--smoke);padding:4rem 0;font-size:.95rem;line-height:2.2}
.cart-empty span{display:block;font-size:2.5rem;margin-bottom:.5rem}
.c-item{display:flex;gap:.85rem;padding:.9rem 0;border-bottom:1px solid var(--border);align-items:flex-start}
.c-item:last-child{border-bottom:none}
.c-img{width:66px;height:86px;object-fit:cover;background:var(--ink3);flex-shrink:0;border:1px solid var(--border)}
.c-info{flex:1;min-width:0;text-align:right}
.c-name{font-size:.92rem;font-weight:600;color:var(--cream);margin-bottom:.15rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.c-meta{font-size:.78rem;color:var(--smoke);margin-bottom:.3rem}
.c-price{font-size:.92rem;font-weight:700;color:var(--gold)}
.qty-row{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;justify-content:flex-end}
.qty-b{width:34px;height:34px;border:1px solid var(--border2);background:var(--ink);color:var(--cream);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all var(--fast)}
.qty-b:hover{border-color:var(--rose);color:var(--rose)}
.qty-n{min-width:26px;text-align:center;font-weight:700;font-size:.92rem}
.c-rm{background:none;border:none;color:var(--smoke);cursor:pointer;font-size:.8rem;transition:color var(--fast);margin-right:auto;padding:.5rem}
.c-rm:hover{color:var(--danger)}
.cart-ft{padding:1.1rem 1.25rem;padding-bottom:calc(1.1rem + var(--safe-b));border-top:1px solid var(--border)}
.cf-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--smoke);margin-bottom:.35rem}
.cf-disc{display:flex;justify-content:space-between;font-size:.88rem;color:var(--success);margin-bottom:.35rem}
.cf-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;color:var(--cream);padding-top:.65rem;border-top:1px solid var(--border);margin-bottom:.9rem}
.upsell{font-size:.8rem;color:var(--rose);margin-bottom:.8rem;padding:.5rem .75rem;border:1px dashed rgba(var(--rose-rgb),.35);background:rgba(var(--rose-rgb),.05);text-align:center}
.btn-checkout{width:100%;min-height:52px;padding:.9rem;background:var(--rose);color:var(--on-rose);border:none;cursor:pointer;font-weight:700;font-size:1rem;transition:all var(--normal)}
.btn-checkout:hover{background:var(--rose2)}
.deliv-hint{font-size:.8rem;color:var(--smoke);text-align:center;margin-bottom:.8rem;line-height:1.7}

/* ═══ QUICK CHECKOUT SHEET ═══ */
.quick-ov{position:fixed;inset:0;background:rgba(var(--ink-rgb),.88);z-index:700;display:none;align-items:flex-end;justify-content:center}
.quick-ov.open{display:flex}
.quick-sheet{background:var(--ink2);border-top:2px solid var(--rose);width:100%;max-width:560px;max-height:94svh;overflow-y:auto;animation:sheetUp .35s var(--ease)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.quick-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:.7rem auto 0}
.quick-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.25rem .6rem 1.25rem;border-bottom:1px solid var(--border)}
.quick-head h3{font-size:1.15rem;font-weight:700;color:var(--cream)}
.quick-x{background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.6rem;line-height:1;width:44px;height:44px}
.quick-body{padding:1.1rem 1.25rem;padding-bottom:calc(1.75rem + var(--safe-b))}
.quick-summary{margin-bottom:1rem;background:var(--ink3);border:1px solid var(--border);padding:.8rem 1rem}
.qs-item{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;color:var(--smoke);padding:.3rem 0;border-bottom:1px solid var(--border)}
.qs-item span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-item span:last-child{white-space:nowrap}
.qs-item:last-child{border:none}
.qs-disc{font-size:.82rem;color:var(--success);padding:.3rem 0}
.quick-fields{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1rem}
.qf{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.qf.full{grid-column:1/-1}
.qf span{font-size:.78rem;color:var(--gold);font-weight:600}
.qf input,.qf select{width:100%;background:none;border:none;border-bottom:1px solid var(--border2);color:var(--cream);font-size:16px;padding:.65rem 0;outline:none;transition:border-color .15s;text-align:right;direction:rtl;border-radius:0}
.qf input::placeholder{color:var(--smoke)}
.qf input:focus,.qf select:focus{border-bottom-color:var(--rose)}
.qf select option{background:var(--ink2);color:var(--cream)}
.quick-total{background:var(--ink3);border:1px solid var(--border);padding:.8rem 1rem;margin-bottom:1rem}
.qt-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--smoke);padding:.2rem 0}
.qt-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;color:var(--cream);padding-top:.5rem;border-top:1px solid var(--border);margin-top:.3rem}
.btn-wa-big{width:100%;min-height:54px;padding:.95rem;background:#25D366;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:.65rem;transition:background .15s;margin-bottom:.6rem}
.btn-wa-big:hover{background:#1dba57}
.quick-note{text-align:center;font-size:.8rem;color:var(--smoke)}

/* ═══ TRUST BAR ═══ */
.trust{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1rem 1.5rem;background:var(--ink2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:1.2rem clamp(.75rem,3vw,2rem)}
.t-item{display:flex;align-items:center;gap:.65rem}
.t-icon{font-size:1.4rem}
.t-text strong{display:block;font-size:.88rem;color:var(--cream);font-weight:600}
.t-text span{font-size:.78rem;color:var(--smoke)}
.t-sep{width:1px;height:28px;background:var(--border)}

/* ═══ FOOTER ═══ */
footer{background:var(--ink2);border-top:1px solid var(--border);padding:2.5rem clamp(.75rem,3vw,2rem);padding-bottom:calc(2.5rem + var(--safe-b));display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:center}
.footer-brand{font-family:'Cairo',sans-serif;font-size:1.8rem;font-weight:700;line-height:1.2;background:linear-gradient(135deg,var(--gold),var(--rose));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block}
.footer-brand.latin{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:2.2rem;letter-spacing:.2em;text-transform:uppercase}
.footer-sub{font-size:.85rem;color:var(--smoke);margin-top:.3rem}
.social{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap}
.social a{padding:.35rem .9rem;border:1px solid var(--border2);color:var(--cream2);font-size:.82rem;text-decoration:none;transition:all var(--fast)}
.social a:hover{border-color:var(--gold);color:var(--gold)}
.footer-r{text-align:left;font-size:.9rem;color:var(--smoke);line-height:2}
.footer-r a{color:var(--gold2);text-decoration:none;direction:ltr;display:inline-block}
.footer-r a:hover{color:var(--rose2)}

/* ═══ WA FLOAT / SCROLL TOP / TOAST ═══ */
.wa-float{position:fixed;bottom:calc(1.25rem + var(--safe-b));left:1.25rem;z-index:300;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:transform var(--normal);text-decoration:none;animation:waP 2.5s ease-in-out infinite}
.wa-float:hover{transform:scale(1.08);animation:none}
@keyframes waP{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.4)}50%{box-shadow:0 4px 30px rgba(37,211,102,.65)}}
.wa-tip{position:absolute;left:64px;top:50%;transform:translateY(-50%);background:var(--ink2);color:var(--cream);font-size:.78rem;padding:.4rem .7rem;white-space:nowrap;border:1px solid var(--border);opacity:0;pointer-events:none;transition:opacity var(--fast)}
.wa-float:hover .wa-tip{opacity:1}
.scroll-top{position:fixed;bottom:calc(5.5rem + var(--safe-b));left:1.35rem;z-index:299;width:40px;height:40px;border-radius:50%;background:var(--ink2);border:1px solid var(--border2);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all var(--normal)}
.scroll-top.show{opacity:1;pointer-events:all}
.scroll-top:hover{background:var(--gold);color:var(--on-gold)}
.toast{position:fixed;bottom:calc(1.5rem + var(--safe-b));left:50%;transform:translateX(-50%) translateY(5rem);background:var(--ink3);border:1px solid var(--border2);color:var(--cream);padding:.75rem 1.4rem;font-size:.9rem;transition:transform .3s var(--ease);z-index:9999;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}


/* ═══ FONTS FOR TITLES ═══ */
.sec-title,.card-name,.det-name,.hero-title,.blk-title,.quick-head h3,.cart-hd h3,.tailles-box h3,.footer-brand:not(.latin){font-family:var(--font-t)}

/* ═══ HERO EXTRAS ═══ */
.hero.has-img{min-height:min(78svh,640px)}
.hero-img{background-size:cover;background-position:center}
.hero-ov{background:rgba(var(--ink-rgb),var(--ov,.55))}
.hero-title{font-size:clamp(1.8rem,5vw,3rem);font-weight:700;line-height:1.35;margin-bottom:.8rem;max-width:760px}

/* ═══ SORT / RAIL ═══ */
.sec-tools{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:flex-end}
.sort-sel{background:var(--ink2);color:var(--cream2);border:1px solid var(--border2);padding:.5rem .8rem;font-size:.85rem;min-height:40px;border-radius:0}
.feat{padding-bottom:1.5rem}
.rail{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:.4rem}
.rail .card{flex:0 0 min(260px,46vw);scroll-snap-align:start;border:1px solid var(--border)}

/* ═══ CUSTOM BLOCKS ═══ */
.blk{padding:3rem clamp(.75rem,3vw,2rem)}
.blk-in{max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem;position:relative}
.blk-title{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;line-height:1.4}
.blk-body{color:var(--cream2);opacity:.92;line-height:2;white-space:pre-line}
.blk-text.bg-dark{background:var(--ink)}
.blk-text.bg-card{background:var(--ink2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.blk-text.bg-accent{background:var(--gold);color:var(--on-gold)}
.blk-text.bg-accent .blk-body{color:inherit}
.blk-text.bg-accent .btn-gold{background:var(--on-gold);color:var(--gold)}
.blk-banner{position:relative;min-height:300px;display:flex;align-items:center;background:var(--ink3) center/cover no-repeat;overflow:hidden}
.blk-banner .bn-ov{position:absolute;inset:0;background:rgba(var(--ink-rgb),.5)}
.blk-banner .blk-in{width:100%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;transition:transform var(--normal)}
@media(hover:hover){.gal img:hover{transform:scale(1.02)}}
.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:.5rem}
.faq details{border:1px solid var(--border);background:var(--ink2)}
.faq summary{padding:.9rem 1rem;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:1rem;min-height:48px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--gold);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:'−'}
.faq p{padding:0 1rem 1rem;color:var(--cream2);line-height:1.9;opacity:.9;white-space:pre-line}

/* ═══ PROMO CODE / RELATED / POLICIES / FOOTER ═══ */
.code-row{display:flex;gap:.4rem;margin-bottom:.4rem}
.code-row input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--border2);color:var(--cream);padding:.65rem .8rem;font-size:16px;outline:none;text-align:right;direction:rtl;text-transform:uppercase;border-radius:0}
.code-row input:focus{border-color:var(--rose)}
.code-row button{padding:0 1.1rem;background:transparent;border:1px solid var(--border2);color:var(--cream);cursor:pointer;font-weight:600;min-height:44px;transition:all var(--fast)}
.code-row button:hover{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.code-msg{font-size:.8rem;margin-bottom:.7rem}
.code-msg.ok{color:var(--success)}.code-msg.bad{color:var(--danger)}
.code-x{background:none;border:none;color:var(--smoke);text-decoration:underline;cursor:pointer;font-size:.78rem}
.rel{border-top:1px solid var(--border);padding-top:.9rem}
.rel-t{font-size:.82rem;color:var(--gold);font-weight:600;margin-bottom:.6rem}
.rel-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.rel-i{background:none;border:1px solid var(--border);padding:0;color:var(--cream);cursor:pointer;display:flex;flex-direction:column;text-align:right;min-width:0}
.rel-i img{width:100%;aspect-ratio:3/4;object-fit:cover}
.rel-i span{font-size:.72rem;line-height:1.45;padding:.35rem .4rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel-i b{font-size:.78rem;color:var(--gold);padding:.1rem .4rem .4rem}
.pol-body{font-size:.92rem;color:var(--cream2);line-height:2.05;white-space:pre-line;text-align:right}
.f-pol{display:flex;gap:.2rem .9rem;flex-wrap:wrap;margin-top:.9rem}
.f-pol button{background:none;border:none;color:var(--smoke);font-size:.82rem;text-decoration:underline;cursor:pointer;padding:.4rem .1rem;min-height:36px}
.f-pol button:hover{color:var(--gold)}
.f-contact{margin-top:.7rem;font-size:.82rem;line-height:1.95;color:var(--smoke)}
.f-contact a{color:var(--gold2);text-decoration:none}
@media(max-width:640px){
  .sec-tools{justify-content:flex-start;width:100%}
  .sort-sel{width:100%}
  .rail .card{flex-basis:44vw}
  .blk{padding:2rem .9rem}
  .blk-banner{min-height:230px}
  .gal{grid-template-columns:repeat(2,1fr)}
  .rel-row{grid-template-columns:repeat(2,1fr)}
  .f-pol,.f-contact{justify-content:center;text-align:center}
}

/* ═══ TABLET ═══ */
@media(max-width:900px){
  .det-modal{grid-template-columns:1fr}
}

/* ═══ MOBILE ═══ */
@media(max-width:640px){
  :root{--hh:58px}
  header{grid-template-columns:auto 1fr auto;padding:0 .4rem}
  .menu-btn{display:flex}
  .logo-img{height:40px;max-width:52vw}
  .cart-btn{padding:0 .8rem;height:40px}
  .hero{min-height:0;padding:2.25rem 1.25rem 2.5rem}
  .hero-logo{height:auto;width:min(66vw,260px);margin-bottom:.9rem}
  .hero-sub{font-size:.95rem;margin-bottom:1.5rem}
  .hero-btns{flex-direction:column;gap:.6rem;width:100%;max-width:340px}
  .btn-gold,.btn-ghost{width:100%}
  .section{padding:1.75rem .6rem 2.5rem}
  .sec-head{flex-direction:column;align-items:flex-start;margin-bottom:1.1rem;gap:.2rem}
  .sec-sub{text-align:right;max-width:100%;font-size:.85rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-imgs{aspect-ratio:4/5}
  .card-body{padding:.7rem .65rem .8rem}
  .card-cat{font-size:.68rem}
  .card-name{font-size:.86rem;line-height:1.5;min-height:2.95em;margin-bottom:.4rem}
  .card-prices{gap:.45rem;margin-bottom:.55rem}
  .p-now,.p-reg{font-size:.98rem}
  .p-was{font-size:.76rem}
  .sizes{gap:.3rem;margin-bottom:.45rem}
  .sz{min-width:34px;height:32px;padding:0 .45rem;font-size:.76rem}
  .sz-guide{font-size:.72rem;margin-bottom:.45rem}
  .cd-line{font-size:.7rem;padding:.3rem .45rem;margin-bottom:.55rem}
  .cd-line .cd-lbl{display:none}
  .cd-line{justify-content:center}
  .btn-add{font-size:.82rem;min-height:42px;padding:.4rem .3rem}
  .ic-btn{width:40px;min-height:42px}
  .share{display:none}
  .tag-sale,.tag-badge{font-size:.68rem}
  .det-ov{padding:0;align-items:stretch}
  .det-modal{display:block;width:100%;max-height:none;height:100%;border:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .det-imgs{overflow:visible}
  .det-main{aspect-ratio:4/5}
  .det-info{overflow:visible}
  .det-body{padding:1.1rem 1rem .8rem;gap:.75rem}
  .det-name{font-size:1.2rem}
  .det-foot{padding:.75rem 1rem;padding-bottom:calc(.75rem + var(--safe-b))}
  .det-x{top:max(.6rem,env(safe-area-inset-top,0px));width:44px;height:44px}
  .quick-fields{grid-template-columns:1fr}
  .trust{padding:1rem .75rem;gap:.8rem 1rem;justify-content:flex-start}
  .t-sep{display:none}
  .t-item{flex:1 1 calc(50% - 1rem);min-width:140px}
  .t-icon{font-size:1.25rem}
  .t-text strong{font-size:.82rem}
  .t-text span{font-size:.72rem}
  footer{grid-template-columns:1fr;text-align:center;gap:1.1rem}
  .social{justify-content:center}
  .footer-r{text-align:center}
  .wa-float{bottom:calc(1rem + var(--safe-b));left:1rem;width:50px;height:50px}
  .wa-tip{display:none}
  .scroll-top{bottom:calc(4.7rem + var(--safe-b));left:1.2rem;width:38px;height:38px}
  .search-box input{font-size:1.3rem}
  .search-ov{padding-top:5rem}
}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ═══ UPDATE: search suggestions / buy now / ship bar / recent ═══ */
.s-res{margin-top:1rem;max-height:62vh;overflow-y:auto;background:var(--ink2);border:1px solid var(--border)}
.s-res:empty{display:none}
.s-item{display:flex;align-items:center;gap:.8rem;width:100%;padding:.6rem .8rem;background:none;border:none;border-bottom:1px solid var(--border);color:var(--cream);cursor:pointer;text-align:right;font-size:.92rem;transition:background var(--fast)}
.s-item:hover{background:rgba(var(--gold-rgb),.08)}
.s-item img{width:46px;height:58px;object-fit:cover;background:var(--ink3);flex-shrink:0}
.s-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item b{color:var(--gold);white-space:nowrap}
.s-all{width:100%;padding:.8rem;background:var(--gold);color:var(--on-gold);border:none;cursor:pointer;font-weight:700;font-size:.9rem}
.s-none{padding:1.2rem;text-align:center;color:var(--smoke)}
.det-foot{display:flex;flex-wrap:wrap;gap:.5rem}
.det-foot>*{flex:1 1 140px}
.det-foot>a.btn-add{margin-top:0!important}
.btn-buy{background:var(--gold)!important;color:var(--on-gold)!important;border-color:var(--gold)!important}
.btn-buy:hover{background:var(--gold3)!important}
.det-save{font-size:.82rem;color:var(--success);font-weight:600}
.det-acts{display:flex;gap:.5rem}
.ship-bar{height:6px;background:var(--ink3);border:1px solid var(--border);margin:0 0 .5rem;overflow:hidden}
.ship-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width var(--slow) var(--ease)}
.ship-ok{font-size:.8rem;color:var(--success);text-align:center;margin-bottom:.6rem;font-weight:600}

function offerActive(o){
  if(!o||o.on===false)return false;
  const now=Date.now();
  if(o.start){const s=new Date(o.start+'T00:00:00').getTime();if(!isNaN(s)&&now<s)return false;}
  if(o.end){const e=new Date(o.end+'T23:59:59').getTime();if(!isNaN(e)&&now>e)return false;}
  return true;
}
function itemCat(c){
  if(c.cat!==undefined&&c.cat!==null)return String(c.cat).trim();
  const p=allProducts().find(x=>x.id===c.pid);return p?String(p.category||'').trim():'';
}
function inScope(o,c){
  if(c.pack&&o.type!=='freeship')return false;
  const sc=o.scope||'all';
  if(sc==='cats')return (o.cats||[]).includes(itemCat(c));
  if(sc==='products')return (o.pids||[]).includes(c.pid);
  return true;
}
function unitsOf(items){const u=[];items.forEach(c=>{for(let i=0;i<c.qty;i++)u.push(c.price);});return u;}
function offerAmount(o,items,sub){
  if(o.minOrder&&sub<num(o.minOrder,0))return 0;
  const el=unitsOf(items.filter(c=>inScope(o,c)));
  if(!el.length)return 0;
  const es=el.reduce((s,x)=>s+x,0);
  if(o.type==='auto'){
    return o.kind==='fixed'?Math.min(num(o.value,0),es):Math.round(es*Math.min(100,num(o.value,0))/100);
  }
  if(o.type==='qty'){
    const t=(o.tiers||[]).filter(t=>num(t.qty,0)>0&&el.length>=num(t.qty,0)).sort((a,b)=>num(b.qty,0)-num(a.qty,0))[0];
    return t?Math.round(es*Math.min(100,num(t.pct,0))/100):0;
  }
  if(o.type==='bundle'){
    const n=parseInt(o.n)||0;if(n<2||el.length<n)return 0;
    const s=el.slice().sort((a,b)=>b-a);let d=0;
    for(let g=0;g+n<=s.length;g+=n){d+=Math.max(0,s.slice(g,g+n).reduce((x,y)=>x+y,0)-num(o.price,0));}
    return Math.round(d);
  }
  if(o.type==='bogo'){
    const b=parseInt(o.buy)||0,g=parseInt(o.get)||0;if(b<1||g<1)return 0;
    const s=el.slice().sort((a,b2)=>b2-a),set=b+g;let d=0;
    for(let i=0;i+set<=s.length;i+=set){for(let k=i+b;k<i+set;k++)d+=s[k]*Math.min(100,num(o.pct,100))/100;}
    return Math.round(d);
  }
  return 0;
}
const normCode=c=>String(c||'').trim().toUpperCase().replace(/\s+/g,'');
function codeWhy(o){
  if(o.start){const s=new Date(o.start+'T00:00:00').getTime();if(!isNaN(s)&&Date.now()<s)return 'هذا الكود لم يبدأ بعد';}
  return 'انتهت صلاحية هذا الكود';
}
function freeThreshold(){
  S=getS();const c=[];
  if(num(S.freeFrom,0)>0)c.push(num(S.freeFrom,0));
  (Array.isArray(S.offers)?S.offers:[]).forEach(o=>{if(o&&o.type==='freeship'&&offerActive(o)&&(o.scope||'all')==='all'&&num(o.minOrder,0)>0)c.push(num(o.minOrder,0));});
  return c.length?Math.min(...c):0;
}
function calcCart(items,codeStr){
  S=getS();
  const sub=items.reduce((s,c)=>s+c.price*c.qty,0);
  const orig=items.reduce((s,c)=>s+(c.origPrice||c.price)*c.qty,0);
  const legacy={id:'_q',type:'qty',name:'تخفيض الكمية',on:true,scope:'all',tiers:[{qty:2,pct:num(S.disc2,3)},{qty:3,pct:num(S.disc3,5)}].filter(t=>t.pct>0)};
  const list=Array.isArray(S.offers)?S.offers:[];
  const offs=[legacy,...list].filter(o=>o&&o.type!=='code'&&offerActive(o));
  let auto=null;
  offs.forEach(o=>{
    if(!['auto','qty','bundle','bogo'].includes(o.type))return;
    const a=Math.min(sub,offerAmount(o,items,sub));
    if(a>0&&(!auto||a>auto.amount))auto={amount:a,label:o.name||'عرض خاص'};
  });
  let freeShip=false;
  offs.forEach(o=>{if(o.type==='freeship'&&items.length&&(!o.minOrder||sub>=num(o.minOrder,0))&&items.some(c=>inScope(o,c)))freeShip=true;});
  let info={status:'none',msg:''},code=null;
  const cs=normCode(codeStr);
  if(cs&&items.length){
    const o=list.find(x=>x&&x.type==='code'&&normCode(x.code)===cs);
    if(!o||o.on===false)info={status:'invalid',msg:'الكود غير صحيح'};
    else if(!offerActive(o))info={status:'expired',msg:codeWhy(o)};
    else if(o.minOrder&&sub<num(o.minOrder,0))info={status:'min',msg:'الحد الأدنى للطلب لهذا الكود: '+o.minOrder+' '+cur()};
    else if(!items.some(c=>inScope(o,c)))info={status:'scope',msg:'هذا الكود لا ينطبق على المنتجات الموجودة في سلتك'};
    else{
      const el=items.filter(c=>inScope(o,c)).reduce((s,c)=>s+c.price*c.qty,0);
      const ratio=(S.stackCode===false||!auto||sub<=0)?1:(sub-auto.amount)/sub;
      let amt=0;
      if(o.kind==='percent')amt=Math.round(el*ratio*Math.min(100,num(o.value,0))/100);
      else if(o.kind==='fixed')amt=Math.min(Math.round(el*ratio),num(o.value,0));
      code={amount:amt,label:'كود '+cs,free:o.kind==='freeship'};
      info={status:'ok',msg:o.kind==='freeship'?'تم تطبيق الكود — التوصيل مجاني ✓':'تم تطبيق الكود ✓'};
    }
  }
  if(code&&S.stackCode===false&&auto&&!code.free){
    if(code.amount>auto.amount)auto=null;
    else{code=null;info={status:'nostack',msg:'العرض التلقائي أفضل ولا يُجمع مع الكود'};}
  }
  if(code&&code.free)freeShip=true;
  const discount=(auto?auto.amount:0)+(code?code.amount:0);
  return {sub,orig,savedProd:orig-sub,auto,code,info,freeShip,discount,afterDisc:Math.max(0,sub-discount)};
}

function hex2rgb(h){h=String(h||'').replace('#','').trim();if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))return null;const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
const mix=(c,t,a)=>c.map((v,i)=>Math.round(v+(t[i]-v)*a));
const hexStr=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const lumOf=c=>0.299*c[0]+0.587*c[1]+0.114*c[2];
function applyTheme(){
  const g=hex2rgb(S.accent)||[201,168,76],r=hex2rgb(S.accent2)||[212,160,176];
  const bg=hex2rgb(S.bg)||[11,10,8],tx=hex2rgb(S.textColor)||[247,243,236];
  const st=document.documentElement.style,W=[255,255,255];
  const dark=lumOf(bg)<140;
  st.setProperty('--gold',hexStr(g));st.setProperty('--gold2',hexStr(mix(g,W,.22)));st.setProperty('--gold3',hexStr(mix(g,W,.55)));
  st.setProperty('--rose',hexStr(r));st.setProperty('--rose2',hexStr(mix(r,W,.25)));
  st.setProperty('--gold-rgb',g.join(','));st.setProperty('--rose-rgb',r.join(','));
  st.setProperty('--on-gold',lumOf(g)>150?'#0b0a08':'#ffffff');
  st.setProperty('--on-rose',lumOf(r)>150?'#0b0a08':'#ffffff');
  /* خلفية ونصوص الموقع */
  st.setProperty('--ink',hexStr(bg));
  st.setProperty('--ink2',hexStr(mix(bg,tx,dark?.045:.04)));
  st.setProperty('--ink3',hexStr(mix(bg,tx,dark?.09:.08)));
  st.setProperty('--cream',hexStr(tx));
  st.setProperty('--cream2',hexStr(mix(tx,bg,.1)));
  st.setProperty('--smoke',hexStr(mix(tx,bg,.38)));
  st.setProperty('--ink-rgb',bg.join(','));st.setProperty('--text-rgb',tx.join(','));
  st.setProperty('--r',Math.max(0,Math.min(28,num(S.radius,0)))+'px');
  st.setProperty('color-scheme',dark?'dark':'light');
  document.documentElement.classList.toggle('light',!dark);

const PK_STY={
  fire:{c1:'#e8321a',c2:'#ff8a00',rgb:'255,100,20',on:'#ffffff',deco:'🔥'},
  gold:{c1:'var(--gold)',c2:'var(--gold3)',rgb:'var(--gold-rgb)',on:'var(--on-gold)',deco:'✨'},
  rose:{c1:'#e6357f',c2:'#ff7ab0',rgb:'230,53,127',on:'#ffffff',deco:'💖'},
  neon:{c1:'#0099ff',c2:'#8a3cff',rgb:'80,120,255',on:'#ffffff',deco:'⚡'},
  emerald:{c1:'#0e9f63',c2:'#37c97f',rgb:'20,170,105',on:'#ffffff',deco:'🌿'}
};
const pkTs=v=>{const n=Number(v);return n>0?n:0;};
function packState(pk,now){
  now=now||Date.now();const s=pkTs(pk.startAt),e=pkTs(pk.endAt);
  if(s&&now<s)return 'soon';
  if(e&&now>e)return 'ended';
  return 'live';
}
function packParts(pk){
  const all=getP(),out=[];
  for(const it of (pk.items||[])){
    const p=all.find(x=>x.id===it.pid);
    if(!p)return null;
    out.push({p,qty:Math.max(1,parseInt(it.qty)||1)});
  }
  return out.length?out:null;
}
const packWas=parts=>parts.reduce((s,x)=>s+fp(x.p)*x.qty,0);
function activePacks(){
  return (Array.isArray(S.packs)?S.packs:[]).filter(pk=>pk&&pk.id&&pk.on!==false&&num(pk.price,0)>0&&packState(pk)==='live'&&packParts(pk));
}
let packSig='';
const packSigNow=()=>activePacks().map(p=>p.id).join(',');
function packHTML(pk){
  const parts=packParts(pk);if(!parts)return '';
  const st=PK_STY[pk.style]||PK_STY.fire;
  const was=packWas(parts),price=num(pk.price,0),save=Math.max(0,was-price),pct=was>0?Math.round(save/was*100):0;
  const out=parts.some(x=>isOut(x.p));
  const imgs=pk.image?[pk.image]:parts.map(x=>(x.p.photos||[])[0]).filter(Boolean).slice(0,4);
  const imgHtml=imgs.map(s=>`<img src="${E(s)}" alt="" loading="lazy" decoding="async"/>`).join('');
  const items=parts.map((x,i)=>{
    const szs=(x.p.sizes||[]).filter(s=>!isSold(x.p,s));
    const sel=(x.p.sizes||[]).length?`<select class="pk-sz" data-i="${i}" aria-label="المقاس"><option value="">المقاس</option>${szs.map(s=>`<option value="${E(s)}">${E(s)}</option>`).join('')}</select>`:'';
    return `<li><span class="pk-ck">✓</span><span class="pk-nm" title="${E(x.p.name)}">${E(x.p.name)}${x.qty>1?' × '+x.qty:''}</span>${sel}</li>`;
  }).join('');
  const end=pkTs(pk.endAt);
  const cd=(pk.showTimer!==false&&end)?`<div class="pk-cd-wrap"><div class="pk-cd-l">⏳ ينتهي العرض خلال</div><div class="pk-cd" data-pkend="${end}"><span><b data-u="d">00</b><i>يوم</i></span><span><b data-u="h">00</b><i>ساعة</i></span><span><b data-u="m">00</b><i>دقيقة</i></span><span><b data-u="s">00</b><i>ثانية</i></span></div></div>`:'';
  return `<article class="pk${out?' out':''}" id="pk-${E(pk.id)}" style="--pk1:${st.c1};--pk2:${st.c2};--pk-rgb:${st.rgb};--pk-on:${st.on}">
    <div class="pk-deco" aria-hidden="true">${st.deco}</div>
    ${pk.badge?`<div class="pk-badge">${E(pk.badge)}</div>`:''}
    <div class="pk-in">
      <div class="pk-imgs n${Math.min(4,Math.max(1,imgs.length))}">${imgHtml}${pct>0?`<div class="pk-save">−${pct}%</div>`:''}</div>
      <div class="pk-body">
        <h3 class="pk-name">${E(pk.name)}</h3>
        ${pk.desc?`<p class="pk-desc">${E(pk.desc)}</p>`:''}
        <ul class="pk-items">${items}</ul>
        <div class="pk-prices"><span class="pk-now">${price} ${E(cur())}</span>${save>0?`<span class="pk-was">${was} ${E(cur())}</span><span class="pk-gain">وفّري ${save} ${E(cur())}</span>`:''}</div>
        ${cd}
        ${pk.note?`<div class="pk-note">${E(pk.note)}</div>`:''}
        <button type="button" class="pk-btn" data-pkadd="${E(pk.id)}" ${out?'disabled':''}>${out?'نفذ المخزون':'🛒 أضيفي الباك للسلة'}</button>
      </div>
    </div>
  </article>`;
}
function tickPK(){
  const now=Date.now();
  document.querySelectorAll('.pk-cd').forEach(el=>{
    const end=+el.dataset.pkend,d=Math.max(0,end-now);
    const v={d:Math.floor(d/86400000),h:Math.floor(d%86400000/3600000),m:Math.floor(d%3600000/60000),s:Math.floor(d%60000/1000)};
    for(const k in v){const b=el.querySelector('[data-u="'+k+'"]');if(b)b.textContent=String(v[k]).padStart(2,'0');}
    const w=el.closest('.pk-cd-wrap');if(w)w.classList.toggle('urgent',d>0&&d<3600000);
  });
  const sig=packSigNow();
  if(sig!==packSig){packSig=sig;renderBlocks();}
}
function addPack(id){
  S=getS();
  const pk=(Array.isArray(S.packs)?S.packs:[]).find(x=>x&&x.id===id);
  if(!pk||pk.on===false||packState(pk)!=='live'){toast('انتهى هذا العرض');renderBlocks();return;}
  const parts=packParts(pk);if(!parts){toast('هذا الباك غير متوفر حالياً');return;}
  if(parts.some(x=>isOut(x.p))){toast('الباك غير متوفر حالياً');return;}
  const card=document.getElementById('pk-'+id);
  const sizes=[];let miss=false;
  parts.forEach((x,i)=>{
    if((x.p.sizes||[]).length){
      const sel=card?card.querySelector('.pk-sz[data-i="'+i+'"]'):null;
      const v=sel?sel.value:'';
      if(!v){miss=true;if(sel)sel.classList.add('err');}
      sizes.push(v);
    }else sizes.push('');
  });
  if(miss){toast('اختاري المقاس لكل قطعة في الباك');return;}
  const summary=parts.map((x,i)=>x.p.name+(sizes[i]?' ('+sizes[i]+')':'')+(x.qty>1?' ×'+x.qty:'')).join(' + ');
  const key='pack:'+id,price=num(pk.price,0);
  const ex=cart.find(c=>c.pid===key&&c.sz===summary);
  if(ex)ex.qty++;
  else cart.push({pid:key,pack:true,packId:id,name:'📦 '+pk.name,sz:summary,price,origPrice:packWas(parts),cat:'__pack',photo:(pk.image||(parts[0].p.photos||[])[0]||''),qty:1});
  updateN();toast('أضيف الباك للسلة ✓');
  setTimeout(openCart,380);
}
/* يحذف من السلة الباكات المنتهية ويحدّث ثمن الباقي — يرجع عدد المحذوف */
function syncPackCart(){
  S=getS();let removed=0,ch=false;
  cart=cart.filter(c=>{
    if(!c||!c.pack)return true;
    const pk=(Array.isArray(S.packs)?S.packs:[]).find(x=>x&&x.id===c.packId);
    if(!pk||pk.on===false||packState(pk)!=='live'||!packParts(pk)||!(num(pk.price,0)>0)){removed++;ch=true;return false;}
    const p=num(pk.price,0);if(c.price!==p){c.price=p;ch=true;}
    return true;
  });
  if(ch)updateN();
  return removed;
}

function searchGo(){if(!curQ.trim())return;$('s-ov').classList.remove('open');syncLock();toCat();}
$('s-res').addEventListener('click',e=>{

function openMob(){$('mob-ov').classList.add('open');$('mob-drw').classList.add('open');buildMobCats();syncLock();}
function closeMob(){$('mob-ov').classList.remove('open');$('mob-drw').classList.remove('open');syncLock();}
function getCats(){

function buildMobCats(){

function mobFilter(f){curF=f;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===f));renderP();closeMob();toCat();}
function mobSearch(){curQ=$('mob-inp').value;renderP();if(curQ.trim()){closeMob();toCat();}}
function buildChips(){

function setFilter(f,el){curF=f;document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));if(el)el.classList.add('on');renderP();}
function setSort(v){curSort=v;renderP();}

/* ════════ RENDER PRODUCTS ════════ */
function cardHTML(p,pre){
  pre=pre||'';
  const price=fp(p),ph=p.photos||[],out=isOut(p),sizes=p.sizes||[];
  const D=(a)=>`data-act="${a}" data-id="${p.id}" data-pre="${pre}"`;
  const imgs=ph.map((s,i)=>`<img src="${E(s)}" class="${i===0?'on':''}" alt="${E(p.name)}" ${i===0?'':'loading="lazy"'} decoding="async"/>`).join('');
  const dots=ph.length>1?`<div class="dots">${ph.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('')}</div>`:'';
  const arrows=ph.length>1?`<div class="card-arrows"><button class="arrow" ${D('step')} data-d="1" aria-label="التالي">›</button><button class="arrow" ${D('step')} data-d="-1" aria-label="السابق">‹</button></div>`:'';
  const szHtml=sizes.length
    ?`<div class="sizes" id="${pre}sz-${p.id}">${sizes.map(s=>{const so=isSold(p,s);return `<button type="button" class="sz${so?' sold':''}${selSizes[p.id]===s?' on':''}" ${D('sz')} data-sz="${E(s)}" ${so?'disabled':''}>${E(s)}</button>`;}).join('')}</div>`
      +(S.showSizeGuide!==false?`<button type="button" class="sz-guide" data-act="guide">📏 دليل المقاسات</button>`:'')
    :'<div class="no-size-badge">✨ مقاس موحد</div>';
  const real=p.saleEnd?new Date(p.saleEnd+'T23:59:59').getTime():0;
  const cdOn=p.discount>0&&!out&&(real?real>Date.now():S.showCountdown!==false);
  const cd=cdOn?`<div class="cd-line"><span class="cd-lbl">⚡ العرض ينتهي خلال</span><span class="cd-t" data-cd="${p.id}">--:--:--</span></div>`:'';
  const isW=wish.includes(p.id);
  return `<article class="card ${out?'out':''}" id="${pre}card-${p.id}">
    <div class="card-imgs" id="${pre}imgs-${p.id}" ${D('open')}>${imgs}
      <div class="tags">${p.discount>0?`<div class="tag-sale">−${E(p.discount)}%</div>`:''}${p.badge?`<div class="tag-badge">${E(p.badge)}</div>`:''}</div>
      ${out?'<div class="tag-out">نفذ</div>':''}${arrows}${dots}
    </div>
    <div class="card-body">
      <div class="card-cat">${E(p.category||'موضة')}</div>
      <h3 class="card-name" ${D('open')} title="${E(p.name)}">${E(p.name)}</h3>
      <div class="card-prices">${p.discount>0?`<span class="p-now">${price} ${E(cur())}</span><span class="p-was">${E(p.price)} ${E(cur())}</span>`:`<span class="p-reg">${E(p.price)} ${E(cur())}</span>`}</div>
      ${szHtml}
      <div class="sz-err" id="${pre}err-${p.id}">⚠ اختاري المقاس أولاً</div>
      ${cd}
      <div class="card-foot">
        <button class="btn-add" ${D('add')} ${out?'disabled':''}>${out?'نفذ المخزون':E(S.addLabel||'أضيفي للسلة')}</button>
        <button class="ic-btn wish ${isW?'on':''}" data-wid="${p.id}" ${D('wish')} aria-label="المفضلة">${isW?'♥':'♡'}</button>
        <button class="ic-btn share" ${D('share')} aria-label="مشاركة">↗</button>
      </div>
    </div>
  </article>`;
}
function renderP(){
  const g=$('grid');if(!g)return;
  let ps=getP();
  if(S.hideSoldOut)ps=ps.filter(p=>!isOut(p));
  if(curF==='__wish')ps=ps.filter(p=>wish.includes(p.id));
  else if(curF!=='all')ps=ps.filter(p=>(p.category||'').trim()===curF);
  const q=normC(curQ);
  if(q)ps=ps.filter(p=>normC(p.name).includes(q)||normC(p.category||'').includes(q));
  if(curSort==='def')ps=ps.slice().sort((a,b)=>(isOut(a)?1:0)-(isOut(b)?1:0));
  if(curSort==='asc')ps=ps.slice().sort((a,b)=>fp(a)-fp(b));
  else if(curSort==='desc')ps=ps.slice().sort((a,b)=>fp(b)-fp(a));
  else if(curSort==='sale')ps=ps.slice().sort((a,b)=>(b.discount||0)-(a.discount||0));
  if(!ps.length){g.innerHTML='<div class="empty">لم يتم العثور على منتجات</div>';return;}
  g.innerHTML=ps.map(p=>cardHTML(p,'')).join('');
  g.querySelectorAll('.card-imgs').forEach(el=>{
    const pid=+el.dataset.id;
    if(el.querySelectorAll('img').length>1)swipe(el,()=>stepImg(pid,1,''),()=>stepImg(pid,-1,''));
  });
  startCD();
}
$('blocks').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=+t.dataset.id,pre=t.dataset.pre||'';
  if(a==='open'){const box=t.closest('.card-imgs');if(box&&box._sw&&Date.now()-box._sw<450)return;openDet(id);}
  else if(a==='step')stepImg(id,+t.dataset.d,pre);
  else if(a==='sz')pickSz(id,t.dataset.sz,pre);
  else if(a==='guide')openTailles();
  else if(a==='add')addCart(id,'',pre);
  else if(a==='wish')toggleWish(id);
  else if(a==='share')shareP(id);
  else if(a==='gal')openZoom(t.src);
});
function swipe(el,onNext,onPrev){
  let x0=null,y0=0;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4){el._sw=Date.now();dx<0?onNext():onPrev();}
  });
}
function stepImg(pid,d,pre){
  const c=$((pre||'')+'imgs-'+pid);if(!c)return;
  const imgs=[...c.querySelectorAll('img')];if(imgs.length<2)return;
  const cu=imgs.findIndex(x=>x.classList.contains('on'));
  const nx=(cu+d+imgs.length)%imgs.length;
  imgs.forEach((x,n)=>x.classList.toggle('on',n===nx));
  c.querySelectorAll('.dot').forEach((x,n)=>x.classList.toggle('on',n===nx));
}
function pickSz(pid,sz,pre){
  selSizes[pid]=sz;
  document.querySelectorAll('.sz[data-act="sz"][data-id="'+pid+'"]').forEach(t=>t.classList.toggle('on',t.dataset.sz===sz));
  const e=$((pre||'')+'err-'+pid);if(e)e.classList.remove('show');
}

/* ════════ FLY ════════ */
function flyTo(src){
  const d=document.createElement('div');d.className='fly';
  const r=src.getBoundingClientRect();
  d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+Math.min(r.height/2,200))+'px';
  document.body.appendChild(d);
  const cb=document.querySelector('.cart-btn');
  const dst=cb?cb.getBoundingClientRect():{left:window.innerWidth-40,top:30,width:0,height:0};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.left=(dst.left+dst.width/2)+'px';d.style.top=(dst.top+dst.height/2)+'px';d.style.opacity='0';d.style.transform='scale(0.2)';}));
  setTimeout(()=>d.remove(),700);
}

/* ════════ CART ════════ */
function addCart(pid,szOv,pre){
  const p=getP().find(x=>x.id===pid);if(!p||isOut(p))return;
  const sz=szOv||selSizes[pid]||'';
  if(p.sizes&&p.sizes.length&&!sz){
    const e=$((pre||'')+'err-'+pid);if(e){e.classList.add('show');e.scrollIntoView({block:'center',behavior:'smooth'});}
    toast('اختاري المقاس أولاً');return;
  }
  if(sz&&isSold(p,sz)){toast('هذا المقاس نفذ');return;}
  const price=fp(p);
  const ex=cart.find(c=>c.pid===pid&&c.sz===sz);
  if(ex)ex.qty++;else cart.push({pid,name:p.name,sz,price,origPrice:p.price,cat:(p.category||'').trim(),photo:(p.photos&&p.photos[0])||'',qty:1});
  updateN();toast('أضيف للسلة ✓');
  const src=$((pre||'')+'card-'+pid)||$('card-'+pid);if(src&&!$('det-ov').classList.contains('open'))flyTo(src);
  setTimeout(openCart,380);
}
function buyNow(pid,sz){
  const p=getP().find(x=>x.id===pid);if(!p||isOut(p))return;
  sz=sz||'';
  if(sz&&isSold(p,sz)){toast('هذا المقاس نفذ');return;}
  if(!cart.find(c=>c.pid===pid&&c.sz===sz))
    cart.push({pid,name:p.name,sz,price:fp(p),origPrice:p.price,cat:(p.category||'').trim(),photo:(p.photos&&p.photos[0])||'',qty:1});
  updateN();showQuickForm();
}
function clearCart(){if(confirm('تفريغ السلة؟')){cart=[];updateN();renderCart();}}
function updateN(){$('cart-n').textContent=cart.reduce((s,c)=>s+c.qty,0);lsSet('olira_cart',cart);}
function openCart(){$('cart-ov').classList.add('open');$('cart-drw').classList.add('open');renderCart();syncLock();}
function closeCart(){$('cart-ov').classList.remove('open');$('cart-drw').classList.remove('open');syncLock();}
function applyCode(){
  appliedCode=normCode($('code-inp').value);lsSet('olira_code',appliedCode);
  renderCart(true);
}
function removeCode(){appliedCode='';lsSet('olira_code','');renderCart();}
function upsellMsg(calc){
  S=getS();
  const tq=cart.filter(c=>!c.pack).reduce((s,c)=>s+c.qty,0);
  if(tq===1&&num(S.disc2,3)>0)return 'أضيفي قطعة أخرى ← خصم '+num(S.disc2,3)+'%!';
  if(tq===2&&num(S.disc3,5)>0)return 'أضيفي قطعة أخرى ← خصم '+num(S.disc3,5)+'%!';
  const th=freeThreshold();
  if(th>0&&!calc.freeShip&&calc.afterDisc<th)return 'باقي '+(th-calc.afterDisc)+' '+cur()+' للحصول على توصيل مجاني 🚚';
  return '';
}
function renderCart(showMsg){
  if(syncPackCart()>0)toast('انتهى عرض أحد الباكات وأُزيل من السلة');
  const ci=$('cart-items'),cf=$('cart-ft');
  if(!cart.length){ci.innerHTML='<div class="cart-empty"><span>🛒</span>سلتك فارغة</div>';cf.innerHTML='';return;}
  ci.innerHTML=cart.map((c,i)=>`<div class="c-item">
    ${c.photo?`<img class="c-img" src="${E(c.photo)}" alt=""/>`:'<div class="c-img"></div>'}
    <div class="c-info">
      <div class="c-name">${E(c.name)}</div>
      <div class="c-meta">${c.pack?'يحتوي على: ':'المقاس: '}${E(c.sz||'—')}</div>
      <div class="c-price">${c.price} ${E(cur())} / ${c.pack?'باك':'قطعة'}</div>
      <div class="qty-row">
        <button class="c-rm" onclick="rmItem(${i})">🗑 حذف</button>
        <button class="qty-b" onclick="chgQ(${i},1)" aria-label="زيادة">+</button>
        <span class="qty-n">${c.qty}</span>
        <button class="qty-b" onclick="chgQ(${i},-1)" aria-label="نقصان">−</button>
      </div>
    </div>
  </div>`).join('');
  S=getS();
  const calc=calcCart(cart,appliedCode);
  const up=upsellMsg(calc);
  const thr=freeThreshold();
  const shipBar=thr>0?(calc.freeShip?'<div class="ship-ok">🎉 توصيلك مجاني!</div>':`<div class="ship-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(calc.afterDisc/thr*100))}"><i style="width:${Math.min(100,Math.round(calc.afterDisc/thr*100))}%"></i></div>`):'';
  const msgCls=calc.info.status==='ok'?'ok':'bad';
  const codeRow=(hasCodes()||appliedCode)?`<div class="code-row"><input id="code-inp" type="text" placeholder="عندك كود تخفيض؟" value="${E(appliedCode)}" autocomplete="off" onkeydown="if(event.key==='Enter')applyCode()"/><button type="button" onclick="applyCode()">تطبيق</button></div>
    ${(appliedCode&&calc.info.msg)?`<div class="code-msg ${msgCls}">${E(calc.info.msg)}${calc.info.status==='ok'?' <button type="button" class="code-x" onclick="removeCode()">إزالة</button>':''}</div>`:''}`:'';
  cf.innerHTML=`
    ${codeRow}
    <div class="cf-row"><span>المجموع الفرعي</span><span>${calc.sub} ${E(cur())}</span></div>
    ${calc.savedProd>0?`<div class="cf-disc"><span>تخفيض المنتجات</span><span>−${calc.savedProd} ${E(cur())}</span></div>`:''}
    ${calc.auto?`<div class="cf-disc"><span>🎁 ${E(calc.auto.label)}</span><span>−${calc.auto.amount} ${E(cur())}</span></div>`:''}
    ${calc.code&&calc.code.amount>0?`<div class="cf-disc"><span>🏷️ ${E(calc.code.label)}</span><span>−${calc.code.amount} ${E(cur())}</span></div>`:''}
    ${calc.freeShip?`<div class="cf-disc"><span>🚚 التوصيل</span><span>مجاني</span></div>`:''}
    <div class="cf-total"><span>الإجمالي</span><span>${calc.afterDisc} ${E(cur())}</span></div>
    <div class="deliv-hint">${E(delivHint())}</div>
    ${shipBar}
    ${up?`<div class="upsell">🎁 ${E(up)}</div>`:''}
    ${S.ordersPaused?`<div class="upsell" style="border-color:var(--danger);color:var(--danger)">⏸️ ${E(S.ordersPausedMsg||'استقبال الطلبات متوقف مؤقتاً')}</div>`:''}
    ${(num(S.minOrder,0)>0&&calc.afterDisc<num(S.minOrder,0))?`<div class="upsell">⚠️ الحد الأدنى للطلب: ${num(S.minOrder,0)} ${E(cur())}</div>`:''}
    <button class="btn-checkout" onclick="openCo()" ${S.ordersPaused?'disabled':''}>اطلبي عبر واتساب</button>`;
}
function chgQ(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);renderCart();updateN();}
function rmItem(i){cart.splice(i,1);renderCart();updateN();}

/* ════════ DETAIL ════════ */

      <div class="det-acts"><button type="button" class="ic-btn wish ${wish.includes(p.id)?'on':''}" data-wid="${p.id}" data-act="dwish" aria-label="المفضلة">${wish.includes(p.id)?'♥':'♡'}</button><button type="button" class="ic-btn" data-act="dshare" aria-label="مشاركة">📤</button></div>
      ${p.desc?`<div class="det-desc">${E(p.desc)}</div>`:''}
      ${sizes.length?`<div class="det-sz-lbl"><span>المقاس</span>${S.showSizeGuide!==false?'<button data-act="dguide">📏 دليل المقاسات</button>':''}</div>
      <div class="det-sizes" id="det-szs">${sizes.map(s=>{const so=isSold(p,s);return `<button type="button" class="sz${so?' sold':''}${detSz===s?' on':''}" data-act="dsz" data-sz="${E(s)}" ${so?'disabled':''}>${E(s)}</button>`;}).join('')}</div>
      <div class="det-hint" id="det-hint">⚠ اختاري المقاس أولاً</div>`:''}
      ${rel.length?`<div class="rel"><div class="rel-t">قد يعجبك أيضاً</div><div class="rel-row">${rel.map(r=>`<button type="button" class="rel-i" data-act="rel" data-id="${r.id}"><img src="${E((r.photos||[])[0]||'')}" alt="" loading="lazy"/><span>${E(r.name)}</span><b>${fp(r)} ${E(cur())}</b></button>`).join('')}</div></div>`:''}
    </div>
    <div class="det-foot"><button class="btn-add" data-act="dadd" ${out?'disabled':''}>${out?'نفذ المخزون':E(S.addLabel||'أضيفي للسلة')}</button>${out?'':'<button type="button" class="btn-add btn-buy" data-act="dbuy">⚡ اطلبي الآن</button>'}${out?`<a class="btn-add" style="margin-top:.5rem;text-align:center;text-decoration:none;display:block" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('مرحباً، أرغب في معرفة متى سيتوفر: '+p.name)}">🔔 أخبروني عند التوفر (واتساب)</a>`:''}</div>`;

function detStep(d){
  const ph=(detP&&detP.photos)||[];if(ph.length<2)return;
  const th=[...document.querySelectorAll('.det-thumb')];
  let cu=th.findIndex(t=>t.classList.contains('on'));if(cu<0)cu=0;
  swDet((cu+d+ph.length)%ph.length);
}
function swDet(i){
  const ph=(detP&&detP.photos)||[];if(!ph[i])return;
  $('det-main').src=ph[i];
  document.querySelectorAll('.det-thumb').forEach((t,n)=>t.classList.toggle('on',n===i));
}
function detClick(e){
  if(e.target===$('det-ov'))return closeDet2();
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='dclose')closeDet2();
  else if(a==='thumb')swDet(+t.dataset.i);
  else if(a==='zoom'){const m=$('det-main');if(m&&!(m._sw&&Date.now()-m._sw<450))openZoom(m.src);}
  else if(a==='rel')openDet(+t.dataset.id);
  else if(a==='dsz'){
    detSz=t.dataset.sz;
    if(detP)selSizes[detP.id]=detSz;
    document.querySelectorAll('#det-szs .sz').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    const h=$('det-hint');if(h)h.style.display='none';
  }
  else if(a==='dwish'){if(detP)toggleWish(detP.id);}
  else if(a==='dshare'){if(detP)shareP(detP.id);}
  else if(a==='dbuy'){
    if(!detP)return;
    if(detP.sizes&&detP.sizes.length&&!detSz){const h=$('det-hint');if(h){h.style.display='block';h.scrollIntoView({block:'center',behavior:'smooth'});}toast('اختاري المقاس أولاً');return;}
    const id=detP.id,sz=detSz;closeDet2();buyNow(id,sz);
  }
  else if(a==='dguide')openTailles();
  else if(a==='dadd'){
    if(!detP)return;
    if(detP.sizes&&detP.sizes.length&&!detSz){const h=$('det-hint');if(h){h.style.display='block';h.scrollIntoView({block:'center',behavior:'smooth'});}toast('اختاري المقاس أولاً');return;}
    const id=detP.id;closeDet2();addCart(id,detSz,'');
  }
}
function closeDet2(fromPop){
  const was=$('det-ov').classList.contains('open');
  $('det-ov').classList.remove('open');syncLock();
  if(was&&!fromPop&&/^#p=/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  resetMeta();
  if(was)renderRecent();
}
window.addEventListener('popstate',()=>{
  const m=/^#p=(\d+)/.exec(location.hash);
  if(m)openDet(+m[1],true);else closeDet2(true);
});

function openZoom(s){$('zoom-img').src=s;$('zoom-ov').classList.add('open');syncLock();}
function closeZoom(){$('zoom-ov').classList.remove('open');syncLock();}

/* ════════ WISHLIST / SHARE ════════ */
function toggleWish(pid){
  const i=wish.indexOf(pid);
  if(i>-1)wish.splice(i,1);else wish.push(pid);
  document.querySelectorAll('.wish[data-wid="'+pid+'"]').forEach(el=>{const on=wish.includes(pid);el.textContent=on?'♥':'♡';el.classList.toggle('on',on);});
  lsSet('olira_wish',wish);buildChips();if(curF==='__wish')renderP();toast(i>-1?'أُزيل من المفضلة':'♥ أضيف للمفضلة');
}
function shareP(pid){
  const p=getP().find(x=>x.id===pid);if(!p)return;
  const url=location.href.split('#')[0]+'#p='+pid;
  const text=`🛍️ ${p.name}\n💰 ${fp(p)} ${cur()}${p.discount>0?` (−${p.discount}%)`:''}\n✨ ${S.storeName}`;
  if(navigator.share){navigator.share({title:p.name,text,url}).catch(()=>{});return;}
  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
}

/* ════════ COUNTDOWN ════════ */
let cdTimer=null;
const cdEnds={};
function startCD(){
  Object.keys(cdEnds).forEach(k=>delete cdEnds[k]);
  getP().filter(p=>p.discount>0).forEach(p=>{
    const real=p.saleEnd?new Date(p.saleEnd+'T23:59:59').getTime():0;
    if(real){cdEnds[p.id]=real;return;}
    if(S.showCountdown===false)return;
    const k='olira_cd_'+p.id;let t=0;
    try{t=parseInt(localStorage.getItem(k)||'0')||0;}catch(e){}
    if(!t||t<Date.now()){t=Date.now()+(4+Math.floor(Math.random()*8))*3600000;try{localStorage.setItem(k,t);}catch(e){}}
    cdEnds[p.id]=t;
  });
  clearInterval(cdTimer);tickCD();cdTimer=setInterval(tickCD,1000);
}
function tickCD(){
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const end=cdEnds[el.dataset.cd];if(!end)return;
    const d=Math.max(0,end-Date.now());
    const days=Math.floor(d/86400000),h=Math.floor((d%86400000)/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
    el.textContent=(days>0?days+'ي ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  });
}

/* ════════ CHECKOUT ════════ */
function buildCityOptions(){
  const sel=$('qc');if(!sel)return;
  const keep=sel.value;S=getS();
  const list=(S.cities&&S.cities.length?S.cities:DEF_SETTINGS.cities);
  sel.innerHTML='<option value="">اختاري مدينتك...</option>'
    +list.map(c=>'<option value="'+E(c)+'">'+E(c)+' — '+cityPrice(c)+' '+E(cur())+'</option>').join('')
    +'<option value="__other">مدينة أخرى — '+num(S.delivery,30)+' '+E(cur())+'</option>';
  if(keep)sel.value=keep;
}
function curCity(){const s=$('qc');if(!s)return '';if(s.value==='__other'){const o=$('qco');return o?o.value.trim():'';}return s.value;}
function onCityChange(){const s=$('qc');const w=$('qco-wrap');if(w)w.style.display=(s&&s.value==='__other')?'flex':'none';qCalc();}
function openCo(){if(!cart.length)return;closeCart();showQuickForm();}
function showQuickForm(){
  syncPackCart();if(!cart.length||checkoutBlocked())return;
  S=getS();
  const calc=calcCart(cart,appliedCode);
  $('qs').innerHTML=cart.map(c=>`<div class="qs-item"><span>${E(c.name)} ×${c.qty} (${E(c.sz||'—')})</span><span>${c.price*c.qty} ${E(cur())}</span></div>`).join('')
    +(calc.auto?`<div class="qs-disc">🎁 ${E(calc.auto.label)} −${calc.auto.amount} ${E(cur())}</div>`:'')
    +(calc.code&&calc.code.amount>0?`<div class="qs-disc">🏷️ ${E(calc.code.label)} −${calc.code.amount} ${E(cur())}</div>`:'');
  buildCityOptions();onCityChange();
  const sv=lsGet('olira_cust',null);
  if(sv){
    if(!$('qn').value)$('qn').value=sv.n||'';
    if(!$('qp').value)$('qp').value=sv.p||'';
    if(!$('qa').value)$('qa').value=sv.a||'';
    if(sv.c&&[...$('qc').options].some(o=>o.value===sv.c)){$('qc').value=sv.c;onCityChange();}
  }
  $('quick-ov').classList.add('open');syncLock();
}
function closeQuick(){$('quick-ov').classList.remove('open');syncLock();}
function qCalc(){
  const calc=calcCart(cart,appliedCode);
  const city=curCity();
  const deliv=city?deliveryFor(city,calc):0;
  const fin=calc.afterDisc+deliv;
  const el=$('qt');if(!el)return;
  el.innerHTML=`<div class="qt-row"><span>المجموع الفرعي</span><span>${calc.sub} ${E(cur())}</span></div>`
    +(calc.discount>0?`<div class="qt-row" style="color:var(--success)"><span>التخفيضات</span><span>−${calc.discount} ${E(cur())}</span></div>`:'')
    +(city?`<div class="qt-row"><span>التوصيل (${E(city)})</span><span>${deliv>0?deliv+' '+E(cur()):'مجاني 🎉'}</span></div>`:'')
    +`<div class="qt-total"><span>الإجمالي</span><span>${fin} ${E(cur())}</span></div>`;
}
let _sending=false;
function submitQuick(){
  if(_sending)return;
  S=getS();
  syncPackCart();if(!cart.length){toast('السلة فارغة');return;}
  if(checkoutBlocked())return;
  const n=$('qn').value.trim();
  const p=normPhone($('qp').value);
  const c=curCity();
  const a=$('qa').value.trim();
  const note=$('qnote').value.trim();
  if(!n||!p||!c||c==='__other'||!a){toast('أكملي جميع الحقول');return;}
  if(!/^0[5-7][0-9]{8}$/.test(p)){toast('رقم الهاتف غير صحيح');return;}
  if(!cart.length){toast('السلة فارغة');return;}
  _sending=true;setTimeout(()=>{_sending=false;},4000);
  lsSet('olira_cust',{n,p,a,c});
  const calc=calcCart(cart,appliedCode);
  const deliv=deliveryFor(c,calc);
  const fin=calc.afterDisc+deliv;
  const ords=getO();
  const nid=ords.length?Math.max(...ords.map(o=>o.id))+1:1001;
  ords.push({id:nid,name:n,phone:p,city:c,address:a,note:note||undefined,
    items:cart.map(x=>({productId:x.pid,name:x.name,qty:x.qty,size:x.sz,price:x.price})),
    subtotal:calc.afterDisc,discount:calc.discount,code:calc.code?normCode(appliedCode):undefined,delivery:deliv,total:fin,status:'new',date:new Date().toISOString().split('T')[0]});
  setO(ords);
  syncOrderToSheets({name:n,phone:p,city:c,address:a,
    items:cart.map(x=>({name:x.name,qty:x.qty,size:x.sz,price:x.price})),
    subtotal:calc.afterDisc,delivery:deliv,total:fin,orderId:nid});
  const C=cur();
  let msg='🛍️ *طلب جديد — '+S.storeName+' #'+nid+'*\n\n';
  msg+='👤 *الاسم:* '+n+'\n📞 *الهاتف:* '+p+'\n📍 *المدينة:* '+c+'\n🏠 *العنوان:* '+a+'\n';
  if(note)msg+='📝 *ملاحظة:* '+note+'\n';
  msg+='\n*المنتجات:*\n';
  cart.forEach(x=>{msg+='• '+x.name+' × '+x.qty+' — '+(x.pack?'يحتوي على: ':'المقاس: ')+(x.sz||'—')+' — '+x.price*x.qty+' '+C+'\n';});
  if(calc.auto)msg+='\n🎁 '+calc.auto.label+': −'+calc.auto.amount+' '+C;
  if(calc.code&&calc.code.amount>0)msg+='\n🏷️ '+calc.code.label+': −'+calc.code.amount+' '+C;
  msg+='\n🚚 التوصيل ('+c+'): '+(deliv>0?'+'+deliv+' '+C:'مجاني');
  msg+='\n\n💰 *الإجمالي: '+fin+' '+C+'*';
  if(S.waThanks)msg+='\n\n'+S.waThanks;
  cart=[];updateN();closeQuick();
  window.location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
}

/* ════════ SEO / SHARE META ════════ */
function setMeta(p){
  try{
    const sn=S.storeName||'OliraShop';
    document.title=p.name+' — '+sn;
    const d=(p.desc||'').slice(0,160)||(sn+' — '+fp(p)+' '+cur());
    const set=(id,v)=>{const e=$(id);if(e)e.setAttribute('content',v);};
    set('og-title',p.name+' — '+sn);set('og-desc',d);
    const im=(p.photos||[])[0];if(im&&/^https?:/i.test(im))set('og-img',im);
    let ld=$('ld-json');
    if(!ld){ld=document.createElement('script');ld.type='application/ld+json';ld.id='ld-json';document.head.appendChild(ld);}
    ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:p.name,description:p.desc||p.name,
      image:(p.photos||[]).filter(x=>/^https?:/i.test(x)),category:p.category||undefined,
      offers:{'@type':'Offer',priceCurrency:'MAD',price:fp(p),availability:isOut(p)?'https://schema.org/OutOfStock':'https://schema.org/InStock'}});
  }catch(e){}
}
function resetMeta(){
  try{
    const sn=(S&&S.storeName)||'OliraShop';
    document.title=S.seoTitle||(sn+' — موضة نسائية');
    const ld=$('ld-json');if(ld)ld.remove();
    const set=(id,v)=>{const e=$(id);if(e)e.setAttribute('content',v);};
    set('og-title',document.title);
  }catch(e){}
}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ════════ INIT ════════ */
function applySettings(){
  S=getS();WA=S.wa||DEF_SETTINGS.wa;
  applyTheme();applyFonts();applyFlags();
  renderBlocks();applyBrand();applyContent();
  ['mob-wa','f-wa','wa-float'].forEach(id=>{const a=$(id);if(!a)return;a.href='https://wa.me/'+WA;if(id!=='wa-float')a.textContent=fmtPhone(WA);});
}
$('f-pol').addEventListener('click',e=>{const b=e.target.closest('[data-pol]');if(b)openPolicy(b.dataset.pol);});
function init(){
  seed();applySettings();updateN();maybeWelcome();setInterval(tickPK,1000);
  if(/[?&]preview/.test(location.search)&&S.maintenance)setTimeout(()=>toast('🚧 وضع المعاينة: الموقع مغلق للزوار حالياً'),700);
  const m=/^#p=(\d+)/.exec(location.hash);
  if(m)setTimeout(()=>openDet(+m[1]),300);
  else if(location.hash==='#catalogue')setTimeout(toCat,50);
  const hide=()=>$('loader').classList.add('out');
  if(document.readyState==='complete')setTimeout(hide,250);
  else{window.addEventListener('load',()=>setTimeout(hide,250));setTimeout(hide,3500);}
}
window.addEventListener('scroll',()=>{$('scroll-top').classList.toggle('show',scrollY>500);},{passive:true});
window.addEventListener('storage',e=>{
  if(['luxe_products','olira_updated','olira_settings'].includes(e.key))applySettings();
});
init();
